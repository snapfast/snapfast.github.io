# config.yml
title: Rahul Bali
description: Personal website of Rahul Bali - Engineer, technologist, and explorer of consciousness.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.rahulbali.in" # the base hostname & protocol for your site

# author
author:
  name: Rahul Bali
  twitter: SkyDyaus

# Twitter metadata for SEO / social cards
twitter:
  username: SkyDyaus

# Default social preview card image (1200x630) & logo
image:
  path: /assets/images/og-image.png
  height: 630
  width: 1200
  alt: "Rahul Bali - Engineer, technologist, and explorer of consciousness"

logo: /assets/images/apple-touch-icon.png

# analytics
google_analytics: G-N6CPNY8CTG

# Build settings
remote_theme: "jekyll/minima@1e8a445"

# plugins
plugins:
  - jekyll-sitemap
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# minima
minima:
  skin: auto
  date_format: "%d %B, %Y"
  show_excerpts: true
  social_links:
    - title: at GitHub
      icon: github
      url: "https://github.com/snapfast"
    - title: X (formerly Twitter)
      icon: x-twitter
      url: "https://x.com/SkyDyaus"

# Build settings
markdown: kramdown
excerpt_separator: "--excerpt" #global excerpt separator for the blog posts

# headers
header_pages:
  - about.md
  - writings.md
  - projects.md
  - engineering-blogs.md
  - careers.md
  - resume.md
  - contact.md
