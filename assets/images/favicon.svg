<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)"/>

  <!-- Outer Ring Accent -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#accent-grad)" stroke-width="8" opacity="0.6"/>

  <!-- Monogram RB Text -->
  <g transform="translate(256, 256)" text-anchor="middle" dominant-baseline="central">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="900"
          font-size="240"
          letter-spacing="-10"
          fill="url(#text-grad)">RB</text>
  </g>

  <!-- Accent Glow Dot -->
  <circle cx="390" cy="380" r="24" fill="url(#accent-grad)" />
</svg>